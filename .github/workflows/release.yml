on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传附件的 release tag（例如 v0.6.0）"
        required: true

env:
  # release 事件取 tag 名；手动触发取输入，便于修复后重跑
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: xmake-io/github-action-setup-xmake@v1

      # 预装的 LLVM 20 编译新版 MSVC STL 会报 STL1000（要求 Clang >= 22），这里显式装 23
      - name: Install LLVM 23
        run: choco install llvm --version=23.1.3 -y --no-progress

      - name: Check clang-cl version
        shell: pwsh
        run: |
          $v = (clang-cl --version | Select-Object -First 1)
          Write-Host $v
          if ($v -notmatch 'version (\d+)' -or [int]$Matches[1] -lt 22) {
            throw "clang-cl 版本过低，需要 >= 22：$v"
          }

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-clang23-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-clang23-
            xmake-

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows --toolchain=clang-cl --target_type=server -y

      - run: xmake -w -y

      - uses: actions/upload-artifact@v4
        with:
          name: mod-windows-x64-${{ github.sha }}
          path: bin/

  update-release-notes:
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mod-windows-x64-${{ github.sha }}
          path: artifact

      - name: Pack release zip
        run: |
          cp CHANGELOG.md LICENSE README.md artifact/
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          ZIP_NAME="${{ github.event.repository.name }}-${VERSION}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          (cd artifact && zip -r "../${ZIP_NAME}" *)
          ls -l "${ZIP_NAME}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
